<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshers Quest - MISSION 01</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;display:flex;justify-content:center;align-items:center;color:#222;padding:20px}
.card{background:#fff;width:100%;max-width:520px;padding:42px 30px;border-radius:25px;text-align:center;

.emoji{font-size:58px}h1{margin:8px 0;color:#764ba2;font-size:30px;letter-spacing:1px}
h2{margin:25px 0 15px;font-size:21px}.task{background:#f3efff;padding:24px 20px;border-radius:16px;

.next{display:inline-block;margin-top:15px;padding:14px 25px;background:#764ba2;color:#fff;
border-radius:30px;font-weight:bold}.small{font-size:13px;color:#777;margin-top:25px}
</style>
</head>
<body>
<div class="card">
<div class="emoji">🪙</div>
<h1>FRESHERS QUEST</h1>
<h2>MISSION 01</h2>
<div class="task">Find a <strong>₹2 coin</strong> from any year between <strong>2022 and 2025</strong>.</div>
<p class="note">Completed the challenge? 👀<br>Once completed, proceed to <strong>QR 2</strong>.</p>
<div class="next">MISSION COMPLETE ✓</div>
<p class="small">Please complete the task responsibly and with everyone's consent where applicable.</p>
</div>
